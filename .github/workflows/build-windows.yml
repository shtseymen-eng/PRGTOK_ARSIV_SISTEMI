name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Tesseract via choco
        run: |
          choco install tesseract -y --no-progress
          refreshenv
          echo "Tesseract installed"

      - name: Install Turkish language for Tesseract
        run: |
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          $url = "https://github.com/tesseract-ocr/tessdata/raw/main/tur.traineddata"
          Invoke-WebRequest -Uri $url -OutFile "$tessdata\tur.traineddata"
          echo "Turkish language data installed"

      - name: Build EXE with PyInstaller
        shell: cmd
        run: >
          pyinstaller --noconfirm --onedir --noupx --windowed
          --name PRGTOK_ARSIV_SISTEMI
          --icon assets/app_icon.ico
          --add-data "assets;assets"
          --add-data "main_paned.py;."
          --add-data "C:\Program Files\Tesseract-OCR;tesseract"
          --hidden-import fitz
          main.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Setup installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\kurulum.iss"'

      - name: Surum numarasini oku
        id: version
        shell: pwsh
        run: |
          $content = Get-Content motor.py -Raw -Encoding UTF8
          $match = [regex]::Match($content, 'SURUM = "([0-9.]+)"')
          $ver = if ($match.Success) { $match.Groups[1].Value } else { "2.7.0" }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "Surum: $ver"

      - name: Upload Setup (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PRGTOK_Kurulum_v${{ steps.version.outputs.VERSION }}
          path: installer/cikti/PRGTOK_Arsiv_Kurulum_v${{ steps.version.outputs.VERSION }}.exe

      - name: Upload EXE (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PRGTOK_EXE_v${{ steps.version.outputs.VERSION }}
          path: dist/PRGTOK_ARSIV_SISTEMI/
          if-no-files-found: error
